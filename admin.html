<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Meadow Organics | Admin</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"><link rel="stylesheet" href="styles.css"><style>body{background:#eee8db}.admin-shell{max-width:1120px;margin:60px auto;padding:0 24px}.admin-card{background:#fbf8f1;border:1px solid #d9d0bf;border-radius:24px;padding:30px;box-shadow:0 20px 60px rgba(40,48,40,.1)}.admin-head{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:28px}.admin-head h1{font-family:'Cormorant Garamond',serif;font-size:3rem;margin:0;color:#30372e}.admin-form{max-width:430px;margin:100px auto}.field{display:grid;gap:7px;margin:14px 0}.field label{font-weight:700;font-size:.85rem}.field input,.field select{width:100%;padding:13px 14px;border:1px solid #d9d0bf;border-radius:12px;background:#fffdf7;font:inherit}.table-wrap{overflow:auto}.admin-table{width:100%;border-collapse:collapse}.admin-table th,.admin-table td{text-align:left;padding:13px 10px;border-bottom:1px solid #d9d0bf}.admin-table input{max-width:110px;padding:9px;border:1px solid #d9d0bf;border-radius:9px}.status{padding:10px 0;color:#64705b}.hidden{display:none!important}.top-actions{display:flex;gap:10px;flex-wrap:wrap}.danger{border:0;background:#7c4139;color:#fff;border-radius:999px;padding:9px 14px;cursor:pointer}</style></head><body><header class="site-header"><a class="brand" href="/"><span class="brand-mark">✦</span><span><b>MEADOW</b><small>ORGANICS</small></span></a><a class="button button-ghost" href="/">Back to shop</a></header><main class="admin-shell"><section id="loginPanel" class="admin-card admin-form"><p class="eyebrow">STAFF AREA</p><h1>Admin login</h1><form id="loginForm"><div class="field"><label>Email</label><input id="email" type="email" required autocomplete="username"></div><div class="field"><label>Password</label><input id="password" type="password" required autocomplete="current-password"></div><button class="button button-primary full">Sign in</button><p id="loginStatus" class="status"></p></form></section><section id="dashboard" class="admin-card hidden"><div class="admin-head"><div><p class="eyebrow">INVENTORY</p><h1>Meadow stockroom</h1></div><div class="top-actions"><button id="addProduct" class="button button-primary">Add product</button><button id="logout" class="button button-ghost">Log out</button></div></div><p id="dashStatus" class="status"></p><div class="table-wrap"><table class="admin-table"><thead><tr><th>Product</th><th>Category</th><th>Price</th><th>Stock</th><th>Live</th><th></th></tr></thead><tbody id="inventory"></tbody></table></div></section></main><script src="admin.js"></script></body></html>
